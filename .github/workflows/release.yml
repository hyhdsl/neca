name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: release-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag source and CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $tag" >&2
            exit 1
          fi
          commit="$(git rev-list -n 1 "$GITHUB_REF")"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          if ! git branch -r --contains "$commit" | grep -Eq 'origin/(main|release/[0-9]+\.[0-9]+)$'; then
            echo "tag commit $commit is not on main or release/x.y" >&2
            exit 1
          fi
          conclusion="$(gh api "repos/${{ github.repository }}/commits/$commit/check-runs" --jq '[.check_runs[] | select(.name == "build-and-test")] | sort_by(.started_at) | last | .conclusion')"
          if [[ "$conclusion" != "success" ]]; then
            echo "required build-and-test check is not successful: $conclusion" >&2
            exit 1
          fi

  release:
    name: build-and-release
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build linux binaries
        run: make build

      - name: Checksums
        run: |
          cd dist
          sha256sum neca-linux-amd64 neca-linux-arm64 \
            necad-linux-amd64 necad-linux-arm64 \
            neca-web-helper-linux-amd64 neca-web-helper-linux-arm64 > checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            extra+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/neca-linux-amd64 \
            dist/neca-linux-arm64 \
            dist/necad-linux-amd64 \
            dist/necad-linux-arm64 \
            dist/neca-web-helper-linux-amd64 \
            dist/neca-web-helper-linux-arm64 \
            dist/checksums.txt \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${extra[@]}"
