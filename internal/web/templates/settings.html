{{define "content"}}
{{if .Notice}}<div class="alert ok" role="status" data-testid="settings-notice">{{.Notice}}</div>{{end}}
<section class="panel">
  <div class="panel-head"><h2>{{.T "web.settings.general_title"}}</h2></div>
  <p class="muted">{{.T "web.settings.general_desc"}}</p>
  <div class="settings-list">
    <div class="setting-row">
      <div>
        <h3>{{.T "web.settings.theme"}}</h3>
        <p class="muted small">{{.T "web.settings.theme_desc"}}</p>
      </div>
      <button type="button" class="button secondary" id="theme-toggle" data-testid="theme-toggle" aria-label="{{.T "web.action.theme_aria"}}">{{.T "web.settings.theme_toggle"}}</button>
    </div>
    <div class="setting-row">
      <div>
        <h3>{{.T "web.settings.language"}}</h3>
        <p class="muted small">{{.T "web.settings.language_desc"}}</p>
      </div>
      <span class="lang-switch" aria-label="{{.T "web.action.language"}}">
        <a href="/language?lang=zh-CN&amp;next={{urlquery .Path}}" data-testid="lang-zh" {{if eq .Lang "zh-CN"}}aria-current="true"{{end}}>中文</a>
        <span aria-hidden="true">/</span>
        <a href="/language?lang=en-US&amp;next={{urlquery .Path}}" data-testid="lang-en" {{if eq .Lang "en-US"}}aria-current="true"{{end}}>English</a>
      </span>
    </div>
  </div>
</section>
{{end}}
