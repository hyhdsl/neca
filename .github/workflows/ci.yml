# neca CI（M0 落地，开发文档 §15.2）
#
# 触发：
#   - main、功能分支与临时 release 分支的 push（分支标准见 .github/CONTRIBUTING.md）
#   - 所有 pull_request
#
# 门禁（文档 §13.4）：
#   1. gofmt 无差异
#   2. go vet 通过
#   3. 平台脚本模板纯 ASCII（§9 硬规则 1）
#   4. go test -race 全绿
#   5. 交叉编译 linux/amd64 与 linux/arm64
#   6. 对产物做一次 version 冒烟测试
#   7. Markdown 链接/代码围栏/帮助站结构（M7）
#   8. govulncheck 依赖漏洞扫描（失败即阻断）
#
# 说明：release.yml 与 docker.yml 按计划在 M5 随 v0.1.0 一起落地，
# 当前仓库只有本工作流；GHCR 推送权限届时用内置 GITHUB_TOKEN。
name: ci

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"
      - "security/**"
      - "release/**"
  pull_request:

# 最小权限：CI 只读仓库内容，不使用任何 secret。
permissions:
  contents: read

# 同一分支的新推送会取消旧运行，避免排队浪费额度。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Go（版本取自 go.mod）
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 显示工具链版本
        run: go version

      - name: gofmt 检查
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: 依赖漏洞扫描（govulncheck）
        run: make vuln

      - name: 平台脚本模板 ASCII 校验
        run: make check-ascii

      - name: 语言包 key 一致性
        run: make check-locales

      - name: 文档检查（链接/围栏/帮助站结构）
        run: make check-docs

      - name: 单元测试（-race）
        run: make test

      - name: 交叉编译 linux/amd64 + linux/arm64
        run: make build

      - name: 影子对比（新旧实现 diff = 0）
        run: make shadow

      - name: 冒烟测试（version 子命令）
        run: |
          ./dist/neca-linux-amd64 version
          ./dist/necad-linux-amd64 --version
          ./dist/neca-web-helper-linux-amd64 --version

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: neca-linux
          path: |
            dist/neca-linux-*
            dist/necad-linux-*
            dist/neca-web-helper-linux-*
          retention-days: 7
          if-no-files-found: error

  docker-smoke:
    name: docker-smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 下载已构建二进制
        uses: actions/download-artifact@v8
        with:
          name: neca-linux
          path: dist

      - name: 构建 lite 镜像并验证无参数向导
        run: |
          docker build --target lite -t neca-ci-lite .
          printf '0\n' | docker run --rm -i neca-ci-lite 2>&1 | tee /tmp/neca-wizard.txt
          grep -q 'neca 交互向导' /tmp/neca-wizard.txt

      - name: 构建 web 镜像并验证 necad 可执行
        run: |
          docker build --target web -t neca-ci-web .
          docker run --rm --entrypoint /usr/local/bin/necad neca-ci-web --version
