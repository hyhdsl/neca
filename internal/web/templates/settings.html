{{/* 本模板渲染常规设置页。 */}}
{{define "content"}}
{{if .Notice}}<div class="alert ok" role="status" data-testid="settings-notice">{{.Notice}}</div>{{end}}
<section class="panel">
  <div class="panel-head"><h2>{{.T "web.settings.general_title"}}</h2></div>
  <p class="muted">{{.T "web.settings.general_desc"}}</p>
  <div class="settings-list">
    <div class="setting-row">
      <div>
        <h3>{{.T "web.settings.theme"}}</h3>
        <p class="muted small">{{.T "web.settings.theme_desc"}}</p>
      </div>
      <select id="theme-select" data-theme-select data-testid="theme-select" aria-label="{{.T "web.action.theme_aria"}}">
        <option value="system">{{.T "web.settings.theme_system"}}</option>
        <option value="light">{{.T "web.settings.theme_light"}}</option>
        <option value="dark">{{.T "web.settings.theme_dark"}}</option>
      </select>
    </div>
    <div class="setting-row">
      <div>
        <h3>{{.T "web.settings.language"}}</h3>
        <p class="muted small">{{.T "web.settings.language_desc"}}</p>
      </div>
      <form method="get" action="/language" class="setting-select">
        <input type="hidden" name="next" value="{{.Path}}">
        <select id="language-select" name="lang" data-auto-submit data-testid="language-select" aria-label="{{.T "web.action.language"}}">
          <option value="zh-CN" {{if eq .Lang "zh-CN"}}selected{{end}}>中文</option>
          <option value="en-US" {{if eq .Lang "en-US"}}selected{{end}}>English</option>
        </select>
        <noscript><button type="submit" class="button secondary">{{.T "web.settings.apply_language"}}</button></noscript>
      </form>
    </div>
  </div>
</section>
{{end}}
